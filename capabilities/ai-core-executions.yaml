naftiko: 1.0.0-alpha2
info:
  label: SAP AI Core API — Executions
  description: 'SAP AI Core API — Executions. 4 operations. Lead operation: Sap List Executions. Self-contained Naftiko capability
    covering one Sap business surface.'
  tags:
  - Sap
  - Executions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_API_KEY: SAP_API_KEY
capability:
  consumes:
  - type: http
    namespace: ai-core-executions
    baseUri: https://api.ai.{region}.cfapps.{landscape}.hana.ondemand.com/v2
    description: SAP AI Core API — Executions business capability. Self-contained, no shared references.
    resources:
    - name: lm-executions
      path: /lm/executions
      operations:
      - name: listexecutions
        method: GET
        description: Sap List Executions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by execution status
      - name: createexecution
        method: POST
        description: Sap Create an Execution
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: lm-executions-executionId
      path: /lm/executions/{executionId}
      operations:
      - name: getexecution
        method: GET
        description: Sap Get an Execution
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: executionId
          in: path
          type: string
          description: Execution identifier
          required: true
      - name: deleteexecution
        method: DELETE
        description: Sap Stop an Execution
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: executionId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SAP_API_KEY}}'
  exposes:
  - type: rest
    namespace: ai-core-executions-rest
    port: 8080
    description: REST adapter for SAP AI Core API — Executions. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/lm/executions
      name: lm-executions
      description: REST surface for lm-executions.
      operations:
      - method: GET
        name: listexecutions
        description: Sap List Executions
        call: ai-core-executions.listexecutions
        with:
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createexecution
        description: Sap Create an Execution
        call: ai-core-executions.createexecution
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/lm/executions/{executionid}
      name: lm-executions-executionid
      description: REST surface for lm-executions-executionId.
      operations:
      - method: GET
        name: getexecution
        description: Sap Get an Execution
        call: ai-core-executions.getexecution
        with:
          executionId: rest.executionId
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteexecution
        description: Sap Stop an Execution
        call: ai-core-executions.deleteexecution
        with:
          executionId: rest.executionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ai-core-executions-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP AI Core API — Executions. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: sap-list-executions
      description: Sap List Executions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ai-core-executions.listexecutions
      with:
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
    - name: sap-create-execution
      description: Sap Create an Execution
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ai-core-executions.createexecution
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: sap-get-execution
      description: Sap Get an Execution
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ai-core-executions.getexecution
      with:
        executionId: tools.executionId
      outputParameters:
      - type: object
        mapping: $.
    - name: sap-stop-execution
      description: Sap Stop an Execution
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: ai-core-executions.deleteexecution
      with:
        executionId: tools.executionId
      outputParameters:
      - type: object
        mapping: $.
