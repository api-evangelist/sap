naftiko: 1.0.0-alpha2
info:
  label: SAP Business One Service Layer API — Journal Entries
  description: 'SAP Business One Service Layer API — Journal Entries. 2 operations. Lead operation: Sap List Journal Entries.
    Self-contained Naftiko capability covering one Sap business surface.'
  tags:
  - Sap
  - Journal Entries
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_API_KEY: SAP_API_KEY
capability:
  consumes:
  - type: http
    namespace: business-one-service-layer-journal-entries
    baseUri: https://{server}:50000/b1s/v1
    description: SAP Business One Service Layer API — Journal Entries business capability. Self-contained, no shared references.
    resources:
    - name: JournalEntries
      path: /JournalEntries
      operations:
      - name: listjournalentries
        method: GET
        description: Sap List Journal Entries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createjournalentry
        method: POST
        description: Sap Create a Journal Entry
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: B1SESSION
      value: '{{env.SAP_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: business-one-service-layer-journal-entries-rest
    port: 8080
    description: REST adapter for SAP Business One Service Layer API — Journal Entries. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/journalentries
      name: journalentries
      description: REST surface for JournalEntries.
      operations:
      - method: GET
        name: listjournalentries
        description: Sap List Journal Entries
        call: business-one-service-layer-journal-entries.listjournalentries
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createjournalentry
        description: Sap Create a Journal Entry
        call: business-one-service-layer-journal-entries.createjournalentry
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: business-one-service-layer-journal-entries-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP Business One Service Layer API — Journal Entries. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: sap-list-journal-entries
      description: Sap List Journal Entries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: business-one-service-layer-journal-entries.listjournalentries
      outputParameters:
      - type: object
        mapping: $.
    - name: sap-create-journal-entry
      description: Sap Create a Journal Entry
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: business-one-service-layer-journal-entries.createjournalentry
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
