naftiko: 1.0.0-alpha2
info:
  label: SAP Business One Service Layer API — Orders
  description: 'SAP Business One Service Layer API — Orders. 2 operations. Lead operation: Sap List Sales Orders. Self-contained
    Naftiko capability covering one Sap business surface.'
  tags:
  - Sap
  - Orders
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_API_KEY: SAP_API_KEY
capability:
  consumes:
  - type: http
    namespace: business-one-service-layer-orders
    baseUri: https://{server}:50000/b1s/v1
    description: SAP Business One Service Layer API — Orders business capability. Self-contained, no shared references.
    resources:
    - name: Orders
      path: /Orders
      operations:
      - name: listorders
        method: GET
        description: Sap List Sales Orders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createorder
        method: POST
        description: Sap Create a Sales Order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: B1SESSION
      value: '{{env.SAP_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: business-one-service-layer-orders-rest
    port: 8080
    description: REST adapter for SAP Business One Service Layer API — Orders. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/orders
      name: orders
      description: REST surface for Orders.
      operations:
      - method: GET
        name: listorders
        description: Sap List Sales Orders
        call: business-one-service-layer-orders.listorders
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createorder
        description: Sap Create a Sales Order
        call: business-one-service-layer-orders.createorder
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: business-one-service-layer-orders-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP Business One Service Layer API — Orders. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: sap-list-sales-orders
      description: Sap List Sales Orders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: business-one-service-layer-orders.listorders
      outputParameters:
      - type: object
        mapping: $.
    - name: sap-create-sales-order
      description: Sap Create a Sales Order
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: business-one-service-layer-orders.createorder
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
