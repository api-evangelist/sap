naftiko: 1.0.0-alpha2
info:
  label: SAP S/4HANA Cloud Business Partner API — Addresses
  description: 'SAP S/4HANA Cloud Business Partner API — Addresses. 1 operations. Lead operation: Sap List Business Partner
    Addresses. Self-contained Naftiko capability covering one Sap business surface.'
  tags:
  - Sap
  - Addresses
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_API_KEY: SAP_API_KEY
capability:
  consumes:
  - type: http
    namespace: s4hana-cloud-business-partner-addresses
    baseUri: https://{host}/sap/opu/odata/sap/API_BUSINESS_PARTNER
    description: SAP S/4HANA Cloud Business Partner API — Addresses business capability. Self-contained, no shared references.
    resources:
    - name: A_BusinessPartnerAddress
      path: /A_BusinessPartnerAddress
      operations:
      - name: listbusinesspartneraddresses
        method: GET
        description: Sap List Business Partner Addresses
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SAP_API_KEY}}'
  exposes:
  - type: rest
    namespace: s4hana-cloud-business-partner-addresses-rest
    port: 8080
    description: REST adapter for SAP S/4HANA Cloud Business Partner API — Addresses. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/a-businesspartneraddress
      name: a-businesspartneraddress
      description: REST surface for A_BusinessPartnerAddress.
      operations:
      - method: GET
        name: listbusinesspartneraddresses
        description: Sap List Business Partner Addresses
        call: s4hana-cloud-business-partner-addresses.listbusinesspartneraddresses
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: s4hana-cloud-business-partner-addresses-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP S/4HANA Cloud Business Partner API — Addresses. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: sap-list-business-partner-addresses
      description: Sap List Business Partner Addresses
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: s4hana-cloud-business-partner-addresses.listbusinesspartneraddresses
      outputParameters:
      - type: object
        mapping: $.
