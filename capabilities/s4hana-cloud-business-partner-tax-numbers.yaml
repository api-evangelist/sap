naftiko: 1.0.0-alpha2
info:
  label: SAP S/4HANA Cloud Business Partner API — Tax Numbers
  description: 'SAP S/4HANA Cloud Business Partner API — Tax Numbers. 1 operations. Lead operation: Sap List Tax Numbers.
    Self-contained Naftiko capability covering one Sap business surface.'
  tags:
  - Sap
  - Tax Numbers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_API_KEY: SAP_API_KEY
capability:
  consumes:
  - type: http
    namespace: s4hana-cloud-business-partner-tax-numbers
    baseUri: https://{host}/sap/opu/odata/sap/API_BUSINESS_PARTNER
    description: SAP S/4HANA Cloud Business Partner API — Tax Numbers business capability. Self-contained, no shared references.
    resources:
    - name: A_BusinessPartnerTaxNumber
      path: /A_BusinessPartnerTaxNumber
      operations:
      - name: listbusinesspartnertaxnumbers
        method: GET
        description: Sap List Tax Numbers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SAP_API_KEY}}'
  exposes:
  - type: rest
    namespace: s4hana-cloud-business-partner-tax-numbers-rest
    port: 8080
    description: REST adapter for SAP S/4HANA Cloud Business Partner API — Tax Numbers. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/a-businesspartnertaxnumber
      name: a-businesspartnertaxnumber
      description: REST surface for A_BusinessPartnerTaxNumber.
      operations:
      - method: GET
        name: listbusinesspartnertaxnumbers
        description: Sap List Tax Numbers
        call: s4hana-cloud-business-partner-tax-numbers.listbusinesspartnertaxnumbers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: s4hana-cloud-business-partner-tax-numbers-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP S/4HANA Cloud Business Partner API — Tax Numbers. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: sap-list-tax-numbers
      description: Sap List Tax Numbers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: s4hana-cloud-business-partner-tax-numbers.listbusinesspartnertaxnumbers
      outputParameters:
      - type: object
        mapping: $.
