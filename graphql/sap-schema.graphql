  purchaseOrderNumber: String!
  purchaseOrderType: String!
  supplier: Supplier!
  companyCode: CompanyCode!
  plant: Plant
  purchasingOrganization: String!
  purchasingGroup: String!
  documentDate: Date!
  deliveryDate: Date
  status: String!
  totalNetAmount: Decimal!
  currency: String!
  items: [PurchaseOrderItem!]!
  goodsReceipts: [GoodsReceipt!]!
  invoices: [Invoice!]!
