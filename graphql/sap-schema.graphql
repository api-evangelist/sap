# ─────────────────────────────────────────────
# Queries
# ─────────────────────────────────────────────

type Query {
  # Customers & Sales
  customer(id: ID!): Customer
  customers(filter: CustomerFilter, limit: Int, offset: Int): [Customer!]!
  salesOrder(id: ID!): SalesOrder
  salesOrders(filter: SalesOrderFilter, limit: Int, offset: Int): [SalesOrder!]!
  customerOrder(id: ID!): CustomerOrder
  customerOrders(customerId: ID!, limit: Int, offset: Int): [CustomerOrder!]!

  # Business Partners
  businessPartner(id: ID!): BusinessPartner
  businessPartners(filter: BusinessPartnerFilter, limit: Int, offset: Int): [BusinessPartner!]!

  # Procurement
  supplier(id: ID!): Supplier
  suppliers(filter: SupplierFilter, limit: Int, offset: Int): [Supplier!]!
  purchaseOrder(id: ID!): PurchaseOrder
  purchaseOrders(filter: PurchaseOrderFilter, limit: Int, offset: Int): [PurchaseOrder!]!
  purchaseRequisition(id: ID!): PurchaseRequisition
  purchaseRequisitions(filter: PurchaseRequisitionFilter, limit: Int, offset: Int): [PurchaseRequisition!]!
  invoice(id: ID!): Invoice
  invoices(filter: InvoiceFilter, limit: Int, offset: Int): [Invoice!]!
  goodsReceipt(id: ID!): GoodsReceipt
  goodsReceipts(purchaseOrderId: ID, limit: Int, offset: Int): [GoodsReceipt!]!
  deliveryNote(id: ID!): DeliveryNote
  deliveryNotes(filter: DeliveryNoteFilter, limit: Int, offset: Int): [DeliveryNote!]!
  contract(id: ID!): Contract
  contracts(filter: ContractFilter, limit: Int, offset: Int): [Contract!]!

  # Product / Material
  product(id: ID!): Product
  products(filter: ProductFilter, limit: Int, offset: Int): [Product!]!
  productCategory(id: ID!): ProductCategory
  productCategories(limit: Int, offset: Int): [ProductCategory!]!
  productGroup(id: ID!): ProductGroup
  productGroups(limit: Int, offset: Int): [ProductGroup!]!
  billOfMaterial(id: ID!): BillOfMaterial
  billsOfMaterial(productId: ID, plantId: ID, limit: Int, offset: Int): [BillOfMaterial!]!

  # Plant & Logistics
  plant(id: ID!): Plant
  plants(companyCodeId: ID, limit: Int, offset: Int): [Plant!]!
  storageLocation(id: ID!): StorageLocation
  storageLocations(plantId: ID!, limit: Int, offset: Int): [StorageLocation!]!
  materialDocument(id: ID!): MaterialDocument
  materialDocuments(filter: MaterialDocumentFilter, limit: Int, offset: Int): [MaterialDocument!]!

  # Project System
  project(id: ID!): Project
  projects(filter: ProjectFilter, limit: Int, offset: Int): [Project!]!
  wbsElement(id: ID!): WBSElement
  wbsElements(projectId: ID!, limit: Int, offset: Int): [WBSElement!]!
  network(id: ID!): Network
