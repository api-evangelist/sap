  btpBinding(id: ID!): BTPBinding
  btpBindings(serviceId: ID!, limit: Int, offset: Int): [BTPBinding!]!
  odataService(id: ID!): ODataService
  odataServices(systemAlias: String, limit: Int, offset: Int): [ODataService!]!
  standardIdentifier(id: ID!): StandardIdentifier
  standardIdentifiers(identifierType: String, limit: Int, offset: Int): [StandardIdentifier!]!
}

# ─────────────────────────────────────────────
# Mutations
# ─────────────────────────────────────────────

type Mutation {
  # Sales
  createSalesOrder(input: SalesOrderInput!): SalesOrder!
  updateSalesOrder(id: ID!, input: SalesOrderInput!): SalesOrder!
  createCustomer(input: CustomerInput!): Customer!
  updateCustomer(id: ID!, input: CustomerInput!): Customer!

  # Procurement
  createPurchaseOrder(input: PurchaseOrderInput!): PurchaseOrder!
  updatePurchaseOrder(id: ID!, input: PurchaseOrderInput!): PurchaseOrder!
  approvePurchaseOrder(id: ID!): PurchaseOrder!
  createPurchaseRequisition(input: PurchaseRequisitionInput!): PurchaseRequisition!
  createInvoice(input: InvoiceInput!): Invoice!
  postGoodsReceipt(input: GoodsReceiptInput!): GoodsReceipt!

  # HR
  createEmployee(input: EmployeeInput!): Employee!
  updateEmployee(id: ID!, input: EmployeeInput!): Employee!
  submitLeaveRequest(input: LeaveInput!): Leave!
  approveLeaveRequest(id: ID!, approverId: ID!): Leave!
  submitTimeSheet(id: ID!): TimeSheet!
  approveTimeSheet(id: ID!, approverId: ID!): TimeSheet!

  # Ariba
  createAribaRequisition(realm: String!, input: AribaRequisitionInput!): AribaRequisition!
  submitAribaRequisition(id: ID!): AribaRequisition!

  # Concur
  createConcurExpense(input: ConcurExpenseInput!): ConcurExpense!
  createConcurReport(input: ConcurReportInput!): ConcurReport!
  submitConcurReport(id: ID!): ConcurReport!
  approveConcurReport(id: ID!, approverId: ID!): ConcurReport!

  # Fieldglass
  createWorkOrder(input: WorkOrderInput!): WorkOrder!
  updateWorkOrder(id: ID!, input: WorkOrderInput!): WorkOrder!

  # BTP
  createBTPService(input: BTPServiceInput!): BTPService!
  deleteBTPService(id: ID!): Boolean!
  createBTPBinding(serviceId: ID!, applicationName: String): BTPBinding!
  deleteBTPBinding(id: ID!): Boolean!
}

