  modifiedAt: DateTime
}

type ProductCategory {
  id: ID!
  categoryCode: String!
  categoryName: String!
  parentCategory: ProductCategory
  childCategories: [ProductCategory!]!
  products: [Product!]!
}

type ProductGroup {
  id: ID!
  groupCode: String!
  groupName: String!
  products: [Product!]!
}

type BillOfMaterial {
  id: ID!
