"""
SAP Conceptual GraphQL Schema
Covers SAP S/4HANA, Ariba, Concur, SuccessFactors, Fieldglass, and BTP.
SAP's public APIs are REST/OData-based; this schema represents the unified
data model as it would appear if exposed via GraphQL.
"""

scalar DateTime
scalar Date
scalar Decimal
scalar JSON

# ─────────────────────────────────────────────
# Customer & Sales (S/4HANA Order-to-Cash)
# ─────────────────────────────────────────────

type Customer {
  id: ID!
  customerNumber: String!
  name: String!
  searchTerm: String
  accountGroup: String
  industry: String
  salesOrganization: String
  distributionChannel: String
  division: String
  creditLimit: Decimal
  currency: String
  addresses: [BusinessPartnerAddress!]!
  contacts: [Contact!]!
  salesOrders: [SalesOrder!]!
  createdAt: DateTime
  modifiedAt: DateTime
}

type CustomerOrder {
  id: ID!
  orderNumber: String!
  customer: Customer!
  orderDate: Date!
  requestedDeliveryDate: Date
  status: String!
  totalAmount: Decimal!
  currency: String!
  items: [SalesOrderItem!]!
  deliveryNotes: [DeliveryNote!]!
}

type SalesOrder {
  id: ID!
  salesOrderNumber: String!
  salesOrderType: String!
  customer: Customer!
  salesOrganization: String!
  distributionChannel: String!
  division: String!
  orderDate: Date!
  requestedDeliveryDate: Date
  status: String!
  totalNetAmount: Decimal!
  totalTaxAmount: Decimal
  currency: String!
  plant: Plant
  items: [SalesOrderItem!]!
  invoices: [Invoice!]!
  deliveryNotes: [DeliveryNote!]!
  createdAt: DateTime
  modifiedAt: DateTime
}

type SalesOrderItem {
  id: ID!
  salesOrder: SalesOrder!
  itemNumber: String!
  product: Product!
  orderQuantity: Decimal!
  unit: String!
  netPrice: Decimal!
  currency: String!
  plant: Plant
  storageLocation: StorageLocation
  requestedDeliveryDate: Date
  scheduleLines: [JSON]
}

# ─────────────────────────────────────────────
# Business Partner (S/4HANA Master Data)
# ─────────────────────────────────────────────

type BusinessPartner {
  id: ID!
  businessPartnerNumber: String!
  businessPartnerType: String!
  firstName: String
  lastName: String
  organizationName: String
  searchTerm1: String
  searchTerm2: String
  birthDate: Date
  isNaturalPerson: Boolean!
  isFemale: Boolean
  language: String
  currency: String
  addresses: [BusinessPartnerAddress!]!
  contacts: [Contact!]!
  supplier: Supplier
  customer: Customer
  createdAt: DateTime
  modifiedAt: DateTime
}

type BusinessPartnerAddress {
  id: ID!
  businessPartner: BusinessPartner!
  addressId: String!
  streetName: String
  houseNumber: String
  postalCode: String
  city: String
  region: String
  country: String!
  addressType: String
  isPrimary: Boolean!
  phone: String
  fax: String
  email: String
}

type Contact {
  id: ID!
  businessPartner: BusinessPartner
  firstName: String!
  lastName: String!
  title: String
  email: String
  phone: String
  mobile: String
  department: String
  function: String
  language: String
}

# ─────────────────────────────────────────────
# Procurement (Ariba / S/4HANA Procure-to-Pay)
# ─────────────────────────────────────────────

type Supplier {
  id: ID!
