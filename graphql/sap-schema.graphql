  costCenters(filter: CostCenterFilter, limit: Int, offset: Int): [CostCenter!]!
  profitCenter(id: ID!): ProfitCenter
  profitCenters(controllingArea: String, limit: Int, offset: Int): [ProfitCenter!]!
  functionalArea(id: ID!): FunctionalArea
  functionalAreas(limit: Int, offset: Int): [FunctionalArea!]!
  controlling(id: ID!): Controlling
  controllings(limit: Int, offset: Int): [Controlling!]!

  # HCM / SuccessFactors
  employee(id: ID!): Employee
  employees(filter: EmployeeFilter, limit: Int, offset: Int): [Employee!]!
  employeePosition(id: ID!): EmployeePosition
  employeePositions(limit: Int, offset: Int): [EmployeePosition!]!
  hcmWorker(id: ID!): HCMWorker
  hcmWorkers(filter: HCMWorkerFilter, limit: Int, offset: Int): [HCMWorker!]!
  payroll(id: ID!): Payroll
  payrolls(employeeId: ID!, limit: Int, offset: Int): [Payroll!]!
  leaveRequest(id: ID!): Leave
  leaveRequests(employeeId: ID!, limit: Int, offset: Int): [Leave!]!
  recruitment(id: ID!): Recruitment
  recruitments(filter: RecruitmentFilter, limit: Int, offset: Int): [Recruitment!]!
  successFactorsUser(id: ID!): SuccessFactorsUser
  successFactorsUsers(limit: Int, offset: Int): [SuccessFactorsUser!]!
  timeSheet(id: ID!): TimeSheet
  timeSheets(employeeId: ID!, limit: Int, offset: Int): [TimeSheet!]!
  benefitsPlan(id: ID!): BenefitsPlan
  benefitsPlans(limit: Int, offset: Int): [BenefitsPlan!]!

  # Ariba
  ariba(realm: String!): Ariba
  aribaRequisition(id: ID!): AribaRequisition
  aribaRequisitions(realm: String!, filter: AribaRequisitionFilter, limit: Int, offset: Int): [AribaRequisition!]!
  aribaBid(id: ID!): AribaBid
  aribaBids(realm: String!, limit: Int, offset: Int): [AribaBid!]!

  # Concur
  concurExpense(id: ID!): ConcurExpense
  concurExpenses(employeeId: ID, reportId: ID, limit: Int, offset: Int): [ConcurExpense!]!
  concurReport(id: ID!): ConcurReport
  concurReports(employeeId: ID!, limit: Int, offset: Int): [ConcurReport!]!

  # Fieldglass
  fieldglass(tenantId: String!): Fieldglass
  workOrder(id: ID!): WorkOrder
  workOrders(filter: WorkOrderFilter, limit: Int, offset: Int): [WorkOrder!]!

  # BTP
  btpService(id: ID!): BTPService
