openapi: 3.1.0
info:
  title: SAP AI Core Addresses Bank Accounts API
  description: REST API for deploying, managing, and consuming AI models and workflows on SAP Business Technology Platform. Provides endpoints for scenario management, execution orchestration, model serving, and artifact tracking.
  version: '2.0'
  contact:
    name: SAP Support
    url: https://support.sap.com/
  termsOfService: https://www.sap.com/about/legal/terms-of-use.html
servers:
- url: https://api.ai.{region}.cfapps.{landscape}.hana.ondemand.com/v2
  description: SAP AI Core Production
  variables:
    region:
      description: SAP BTP region
      default: eu10
    landscape:
      description: SAP BTP landscape
      default: hana
security:
- oauth2: []
tags:
- name: Bank Accounts
  description: Business partner bank account details
paths:
  /A_BusinessPartnerBank:
    get:
      operationId: listBusinessPartnerBankAccounts
      summary: Sap List Bank Accounts
      description: Retrieves bank account records for business partners.
      tags:
      - Bank Accounts
      parameters:
      - $ref: '#/components/parameters/Top'
      - $ref: '#/components/parameters/Skip'
      - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: Collection of bank accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  d:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/BusinessPartnerBank'
              examples:
                Listbusinesspartnerbankaccounts200Example:
                  summary: Default listBusinessPartnerBankAccounts 200 response
                  x-microcks-default: true
                  value:
                    d:
                      results:
                      - BusinessPartner: example_value
                        BankIdentification: example_value
                        BankCountryKey: example_value
                        BankNumber: example_value
                        BankAccount: example_value
                        IBAN: example_value
                        SWIFTCode: example_value
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  parameters:
    Filter:
      name: $filter
      in: query
      description: OData filter expression
      schema:
        type: string
    Skip:
      name: $skip
      in: query
      description: Number of entries to skip
      schema:
        type: integer
        minimum: 0
    Top:
      name: $top
      in: query
      description: Maximum number of entries to return
      schema:
        type: integer
        minimum: 1
  schemas:
    BusinessPartnerBank:
      type: object
      properties:
        BusinessPartner:
          type: string
          description: Business partner number
          example: example_value
        BankIdentification:
          type: string
          description: Bank detail identifier
          example: example_value
        BankCountryKey:
          type: string
          description: Bank country key (ISO 3166-1)
          example: example_value
        BankNumber:
          type: string
          description: Bank routing number
          example: example_value
        BankAccount:
          type: string
          description: Bank account number
          example: example_value
        IBAN:
          type: string
          description: International Bank Account Number
          example: example_value
        SWIFTCode:
          type: string
          description: SWIFT/BIC code
          example: example_value
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{subdomain}.authentication.{region}.hana.ondemand.com/oauth/token
          scopes: {}
externalDocs:
  description: SAP AI Core API Reference
  url: https://api.sap.com/api/AI_CORE_API/resource
