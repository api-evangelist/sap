openapi: 3.2.0
info:
  title: Sap Business Partners API
  version: '1.0'
  contact:
    name: SAP Support
    url: https://support.sap.com/
  termsOfService: https://www.sap.com/about/legal/terms-of-use.html
  description: 'Operations tagged Business Partners across 2 of this provider''s published API definitions: sap-business-one-service-layer-openapi.yml, sap-s4hana-cloud-business-partner-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{server}:50000/b1s/v1
  description: SAP Business One Service Layer Server
  variables:
    server:
      description: The hostname of your SAP Business One server
      default: localhost
- url: https://{host}/sap/opu/odata/sap/API_BUSINESS_PARTNER
  description: SAP S/4HANA Cloud OData Endpoint
  variables:
    host:
      description: SAP S/4HANA Cloud hostname
      default: sandbox.api.sap.com
tags:
- name: Business Partners
  description: Manage customers, vendors, and leads
paths:
  /BusinessPartners:
    get:
      operationId: listBusinessPartners
      summary: Sap List Business Partners
      description: Retrieves a list of business partners including customers, vendors, and leads with support for OData query options.
      tags:
      - Business Partners
      parameters:
      - $ref: '#/components/parameters/Select'
      - $ref: '#/components/parameters/Filter'
      - $ref: '#/components/parameters/OrderBy'
      - $ref: '#/components/parameters/Top'
      - $ref: '#/components/parameters/Skip'
      responses:
        '200':
          description: List of business partners
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/BusinessPartner'
              examples:
                Listbusinesspartners200Example:
                  summary: Default listBusinessPartners 200 response
                  x-microcks-default: true
                  value:
                    value:
                    - CardCode: example_value
                      CardName: example_value
                      CardType: cCustomer
                      GroupCode: 10
                      Phone1: example_value
                      EmailAddress: user@example.com
                      FederalTaxID: '500123'
                      Currency: example_value
                      Valid: tYES
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - sessionCookie: []
    post:
      operationId: createBusinessPartner
      summary: Sap Create a Business Partner
      description: Creates a new business partner record in SAP Business One.
      tags:
      - Business Partners
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessPartner'
            examples:
              CreatebusinesspartnerRequestExample:
                summary: Default createBusinessPartner request
                x-microcks-default: true
                value:
                  CardCode: example_value
                  CardName: example_value
                  CardType: cCustomer
                  GroupCode: 10
                  Phone1: example_value
                  EmailAddress: user@example.com
                  FederalTaxID: '500123'
                  Currency: example_value
                  Valid: tYES
      responses:
        '201':
          description: Business partner created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessPartner'
              examples:
                Createbusinesspartner201Example:
                  summary: Default createBusinessPartner 201 response
                  x-microcks-default: true
                  value:
                    CardCode: example_value
                    CardName: example_value
                    CardType: cCustomer
                    GroupCode: 10
                    Phone1: example_value
                    EmailAddress: user@example.com
                    FederalTaxID: '500123'
                    Currency: example_value
                    Valid: tYES
        '400':
          description: Invalid request data
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - sessionCookie: []
    servers:
    - url: https://{server}:50000/b1s/v1
      description: SAP Business One Service Layer Server
      variables:
        server:
          description: The hostname of your SAP Business One server
          default: localhost
  /BusinessPartners('{CardCode}'):
    get:
      operationId: getBusinessPartner
      summary: Sap Get a Business Partner by Code
      description: Retrieves a specific business partner by their card code.
      tags:
      - Business Partners
      parameters:
      - name: CardCode
        in: path
        required: true
        description: The unique card code of the business partner
        schema:
          type: string
        example: example_value
      responses:
        '200':
          description: Business partner details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessPartner'
              examples:
                Getbusinesspartner200Example:
                  summary: Default getBusinessPartner 200 response
                  x-microcks-default: true
                  value:
                    CardCode: example_value
                    CardName: example_value
                    CardType: cCustomer
                    GroupCode: 10
                    Phone1: example_value
                    EmailAddress: user@example.com
                    FederalTaxID: '500123'
                    Currency: example_value
                    Valid: tYES
        '404':
          description: Business partner not found
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - sessionCookie: []
    patch:
      operationId: updateBusinessPartner
      summary: Sap Update a Business Partner
      description: Updates an existing business partner record with the provided fields.
      tags:
      - Business Partners
      parameters:
      - name: CardCode
        in: path
        required: true
        description: The unique card code of the business partner
        schema:
          type: string
        example: example_value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessPartner'
            examples:
              UpdatebusinesspartnerRequestExample:
                summary: Default updateBusinessPartner request
                x-microcks-default: true
                value:
                  CardCode: example_value
                  CardName: example_value
                  CardType: cCustomer
                  GroupCode: 10
                  Phone1: example_value
                  EmailAddress: user@example.com
                  FederalTaxID: '500123'
                  Currency: example_value
                  Valid: tYES
      responses:
        '204':
          description: Business partner updated
        '404':
          description: Business partner not found
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - sessionCookie: []
    servers:
    - url: https://{server}:50000/b1s/v1
      description: SAP Business One Service Layer Server
      variables:
        server:
          description: The hostname of your SAP Business One server
          default: localhost
  /A_BusinessPartner:
    get:
      operationId: listBusinessPartners
      summary: Sap List Business Partners
      description: Retrieves a collection of business partner master records with support for OData query options including filtering, sorting, and pagination.
      tags:
      - Business Partners
      parameters:
      - $ref: '#/components/parameters/Top_2'
      - $ref: '#/components/parameters/Skip_2'
      - $ref: '#/components/parameters/Filter'
      - $ref: '#/components/parameters/Select_2'
      - $ref: '#/components/parameters/Orderby'
      responses:
        '200':
          description: Collection of business partners
          content:
            application/json:
              schema:
                type: object
                properties:
                  d:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/BusinessPartner_2'
              examples:
                Listbusinesspartners200Example:
                  summary: Default listBusinessPartners 200 response
                  x-microcks-default: true
                  value:
                    d:
                      results:
                      - BusinessPartner: example_value
                        BusinessPartnerFullName: example_value
                        BusinessPartnerCategory: '1'
                        BusinessPartnerGrouping: example_value
                        FirstName: example_value
                        LastName: example_value
                        OrganizationBPName1: example_value
                        SearchTerm1: example_value
                        Language: example_value
                        CreationDate: '2026-01-15'
        '401':
          description: Unauthorized
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oauth2: []
    post:
      operationId: createBusinessPartner
      summary: Sap Create a Business Partner
      description: Creates a new business partner master record in SAP S/4HANA Cloud.
      tags:
      - Business Partners
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessPartner_2'
            examples:
              CreatebusinesspartnerRequestExample:
                summary: Default createBusinessPartner request
                x-microcks-default: true
                value:
                  BusinessPartner: example_value
                  BusinessPartnerFullName: example_value
                  BusinessPartnerCategory: '1'
                  BusinessPartnerGrouping: example_value
                  FirstName: example_value
                  LastName: example_value
                  OrganizationBPName1: example_value
                  SearchTerm1: example_value
                  Language: example_value
                  CreationDate: '2026-01-15'
      responses:
        '201':
          description: Business partner created
          content:
            application/json:
              schema:
                type: object
                properties:
                  d:
                    $ref: '#/components/schemas/BusinessPartner_2'
              examples:
                Createbusinesspartner201Example:
                  summary: Default createBusinessPartner 201 response
                  x-microcks-default: true
                  value:
                    d:
                      BusinessPartner: example_value
                      BusinessPartnerFullName: example_value
                      BusinessPartnerCategory: '1'
                      BusinessPartnerGrouping: example_value
                      FirstName: example_value
