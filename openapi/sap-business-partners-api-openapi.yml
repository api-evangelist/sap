components:
  parameters:
    OrderBy:
      name: $orderby
      in: query
      description: OData ordering expression
      schema:
        type: string
    Select:
      name: $select
      in: query
      description: Comma-separated list of fields to include in the response
      schema:
        type: string
    Skip:
      name: $skip
      in: query
      description: Number of records to skip
      schema:
        type: integer
        minimum: 0
    Top:
      name: $top
      in: query
      description: Maximum number of records to return
      schema:
        type: integer
        minimum: 1
    Filter:
      name: $filter
      in: query
      description: OData filter expression
      schema:
        type: string
    Select_2:
      name: $select
      in: query
      description: Comma-separated list of properties to return
      schema:
        type: string
    Orderby:
      name: $orderby
      in: query
      description: OData sort expression
      schema:
        type: string
    Skip_2:
      name: $skip
      in: query
      description: Number of entries to skip
      schema:
        type: integer
        minimum: 0
    Top_2:
      name: $top
      in: query
      description: Maximum number of entries to return
      schema:
        type: integer
        minimum: 1
  schemas:
    BusinessPartner:
      type: object
      properties:
        CardCode:
          type: string
          description: Unique identifier for the business partner
          maxLength: 15
          example: example_value
        CardName:
          type: string
          description: Name of the business partner
          maxLength: 100
          example: example_value
        CardType:
          type: string
          description: Type of business partner
          enum:
          - cCustomer
          - cSupplier
          - cLid
          example: cCustomer
        GroupCode:
          type: integer
          description: Business partner group code
          example: 10
        Phone1:
          type: string
          description: Primary phone number
          example: example_value
        EmailAddress:
          type: string
          description: Email address
          format: email
          example: user@example.com
        FederalTaxID:
          type: string
          description: Tax identification number
          example: '500123'
        Currency:
          type: string
          description: Default currency code
          example: example_value
        Valid:
          type: string
          description: Whether the business partner is active
          enum:
          - tYES
          - tNO
          example: tYES
    BusinessPartner_2:
      type: object
      properties:
        BusinessPartner:
          type: string
          description: Business partner number
          maxLength: 10
          example: example_value
        BusinessPartnerFullName:
          type: string
          description: Full name of the business partner
          example: example_value
        BusinessPartnerCategory:
          type: string
          description: Category (1=Organization, 2=Person, 3=Group)
          enum:
          - '1'
          - '2'
          - '3'
          example: '1'
        BusinessPartnerGrouping:
          type: string
          description: Business partner grouping
          example: example_value
        FirstName:
          type: string
          description: First name (for person category)
          example: example_value
        LastName:
          type: string
          description: Last name (for person category)
          example: example_value
        OrganizationBPName1:
          type: string
          description: Organization name line 1
          example: example_value
        SearchTerm1:
          type: string
          description: Search term 1
          example: example_value
        Language:
          type: string
          description: Correspondence language
          maxLength: 2
          example: example_value
        CreationDate:
          type: string
          format: date
          description: Date the business partner was created
          example: '2026-01-15'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: B1SESSION
      description: Session cookie obtained from the Login endpoint
    basicAuth:
      type: http
      scheme: basic
      description: Basic authentication with SAP user credentials
    oauth2:
      type: oauth2
      description: OAuth 2.0 authentication
      flows:
        clientCredentials:
          tokenUrl: https://{host}/oauth/token
          scopes:
            API_BUSINESS_PARTNER: Access to Business Partner API
