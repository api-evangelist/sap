openapi: 3.1.0
info:
  title: SAP AI Core Addresses Orders API
  description: REST API for deploying, managing, and consuming AI models and workflows on SAP Business Technology Platform. Provides endpoints for scenario management, execution orchestration, model serving, and artifact tracking.
  version: '2.0'
  contact:
    name: SAP Support
    url: https://support.sap.com/
  termsOfService: https://www.sap.com/about/legal/terms-of-use.html
servers:
- url: https://api.ai.{region}.cfapps.{landscape}.hana.ondemand.com/v2
  description: SAP AI Core Production
  variables:
    region:
      description: SAP BTP region
      default: eu10
    landscape:
      description: SAP BTP landscape
      default: hana
security:
- oauth2: []
tags:
- name: Orders
  description: Sales orders, purchase orders, and delivery management
paths:
  /Orders:
    get:
      operationId: listOrders
      summary: Sap List Sales Orders
      description: Retrieves a list of sales orders with support for OData query options including filtering, sorting, and pagination.
      tags:
      - Orders
      parameters:
      - $ref: '#/components/parameters/Select'
      - $ref: '#/components/parameters/Filter'
      - $ref: '#/components/parameters/OrderBy'
      - $ref: '#/components/parameters/Top'
      - $ref: '#/components/parameters/Skip'
      responses:
        '200':
          description: List of sales orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
              examples:
                Listorders200Example:
                  summary: Default listOrders 200 response
                  x-microcks-default: true
                  value:
                    value:
                    - DocEntry: 10
                      DocNum: 10
                      CardCode: example_value
                      DocDate: '2026-01-15'
                      DocDueDate: '2026-01-15'
                      DocTotal: 42.5
                      DocCurrency: example_value
                      DocumentLines:
                      - {}
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      operationId: createOrder
      summary: Sap Create a Sales Order
      description: Creates a new sales order in SAP Business One with line items.
      tags:
      - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
            examples:
              CreateorderRequestExample:
                summary: Default createOrder request
                x-microcks-default: true
                value:
                  DocEntry: 10
                  DocNum: 10
                  CardCode: example_value
                  DocDate: '2026-01-15'
                  DocDueDate: '2026-01-15'
                  DocTotal: 42.5
                  DocCurrency: example_value
                  DocumentLines:
                  - ItemCode: example_value
                    Quantity: 42.5
                    UnitPrice: 42.5
                    Currency: example_value
                    WarehouseCode: example_value
                    TaxCode: example_value
      responses:
        '201':
          description: Sales order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                Createorder201Example:
                  summary: Default createOrder 201 response
                  x-microcks-default: true
                  value:
                    DocEntry: 10
                    DocNum: 10
                    CardCode: example_value
                    DocDate: '2026-01-15'
                    DocDueDate: '2026-01-15'
                    DocTotal: 42.5
                    DocCurrency: example_value
                    DocumentLines:
                    - ItemCode: example_value
                      Quantity: 42.5
                      UnitPrice: 42.5
                      Currency: example_value
                      WarehouseCode: example_value
                      TaxCode: example_value
        '400':
          description: Invalid order data
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    DocumentLine:
      type: object
      properties:
        ItemCode:
          type: string
          description: Item code
          example: example_value
        Quantity:
          type: number
          format: double
          description: Ordered quantity
          example: 42.5
        UnitPrice:
          type: number
          format: double
          description: Price per unit
          example: 42.5
        Currency:
          type: string
          description: Line currency
          example: example_value
        WarehouseCode:
          type: string
          description: Warehouse code for the line item
          example: example_value
        TaxCode:
          type: string
          description: Tax code applied to the line
          example: example_value
    Order:
      type: object
      properties:
        DocEntry:
          type: integer
          description: Unique document entry number
          readOnly: true
          example: 10
        DocNum:
          type: integer
          description: Document number
          example: 10
        CardCode:
          type: string
          description: Business partner code
          example: example_value
        DocDate:
          type: string
          format: date
          description: Document date
          example: '2026-01-15'
        DocDueDate:
          type: string
          format: date
          description: Document due date
          example: '2026-01-15'
        DocTotal:
          type: number
          format: double
          description: Total document amount
          readOnly: true
          example: 42.5
        DocCurrency:
          type: string
          description: Document currency
          example: example_value
        DocumentLines:
          type: array
          description: Order line items
          items:
            $ref: '#/components/schemas/DocumentLine'
          example: []
  parameters:
    Skip:
      name: $skip
      in: query
      description: Number of records to skip
      schema:
        type: integer
        minimum: 0
    Filter:
      name: $filter
      in: query
      description: OData filter expression
      schema:
        type: string
    Select:
      name: $select
      in: query
      description: Comma-separated list of fields to include in the response
      schema:
        type: string
    Top:
      name: $top
      in: query
      description: Maximum number of records to return
      schema:
        type: integer
        minimum: 1
    OrderBy:
      name: $orderby
      in: query
      description: OData ordering expression
      schema:
        type: string
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{subdomain}.authentication.{region}.hana.ondemand.com/oauth/token
          scopes: {}
externalDocs:
  description: SAP AI Core API Reference
  url: https://api.sap.com/api/AI_CORE_API/resource
